name: 问题反馈（Bug）
description: App 行为不符合预期
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 现象
      description: 发生了什么？期望发生什么？
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 环境
      description: 机型 + iOS 版本 + App 版本（TestFlight build 号）
      placeholder: "iPhone 15 / iOS 18.1 / build 3"
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 截图或日志
      description: 可选；截图 / 录屏 / 控制台日志
    validations:
      required: false
